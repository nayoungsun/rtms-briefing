name: 실거래 등록 브리핑

on:
  schedule:
    - cron: '30 21 * * *'
    - cron: '0 22 * * *'    # 07:00 KST (예비 — 앞쪽이 스킵될 경우 대비)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 실거래 수집 (실패 시 2분 뒤 1회 재시도)
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
        run: |
          python rtms.py || { echo "재시도합니다..."; sleep 120; python rtms.py; }

      - name: 리포트 페이지 생성
        run: python build_site.py

      - name: 결과 커밋
        run: |
          git config user.name  "rtms-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html summary.md prev_snapshot.json.gz
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "브리핑 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi
